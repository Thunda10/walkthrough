<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found | Jared Pearlstein</title>
<link rel="icon" href="/walkthrough/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/walkthrough/assets/site.css">
<style>
  body { min-height: 100vh; display: flex; flex-direction: column; }
  main { flex: 1; display: flex; align-items: center; }
  .not-found { width: 100%; padding: 72px 0; text-align: center; }
  .not-found h1 { font-size: clamp(34px, 4.4vw, 48px); line-height: 1.08; letter-spacing: -0.24px; }
  .not-found .lead { color: var(--ink-muted); }
</style>
</head>
<body>

<header class="site-nav">
  <div class="bar">
    <span class="brand">Jared Pearlstein</span>
    <a class="home-btn" href="/walkthrough/">Home</a>
    <nav aria-label="Main">
      <button class="menu" type="button" aria-expanded="false" aria-controls="navlinks"><span class="sr-only">Menu</span><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 8h16M4 16h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <div class="links" id="navlinks"><a href="/walkthrough/#walkthroughs">Walkthroughs</a><a href="/walkthrough/#tours">360 tours</a><a href="/walkthrough/samples/">Renders</a><a href="/walkthrough/#plan-work">Plan work</a></div>
    </nav>
  </div>
</header>

<main>
  <section class="not-found">
    <div class="wrap">
      <h1>Page not found</h1>
      <p class="lead">This page could not be found.</p>
      <div class="buttons">
        <a class="pill" href="/walkthrough/">Back to the portfolio</a>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>&copy; 2026 Jared Pearlstein</span>
    <span>Contact: <a href="sms:+18143152469">text (814) 315-2469</a> <span style="white-space:nowrap">or email <a href="mailto:jpearlsteinprof10@gmail.com">jpearlsteinprof10@gmail.com</a></span></span>
  </div>
</footer>

<script>
(function(){var h=document.querySelector(".site-nav"),b=h.querySelector(".menu");h.classList.add("js");
function set(o){h.classList.toggle("open",o);b.setAttribute("aria-expanded",o)}
b.addEventListener("click",function(e){e.stopPropagation();set(!h.classList.contains("open"))});
h.querySelectorAll(".links a").forEach(function(a){a.addEventListener("click",function(){set(false)})});
document.addEventListener("click",function(e){if(!h.contains(e.target))set(false)});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&h.classList.contains("open")){set(false);b.focus()}});
})();
</script>
</body>
</html>
