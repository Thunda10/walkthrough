function draw(){if(!canvas.width)return;gl.uniform2f(uniforms.resolution,canvas.width,canvas.height);gl.uniform1f(uniforms.yaw,yaw);gl.uniform1f(uniforms.pitch,pitch);gl.uniform1f(uniforms.fov,fov);gl.drawArrays(gl.TRIANGLES,0,6);placeHotspots()}
function direction(a,b){const dx=b.pos[0]-a.pos[0],dy=b.pos[1]-a.pos[1],distance=Math.hypot(dx,dy);return {yaw:Math.atan2(dx,dy),pitch:-Math.atan2(25,distance)}}
function project(targetYaw,targetPitch){let rel=((targetYaw-yaw+Math.PI*3)%(Math.PI*2))-Math.PI;const cp=Math.cos(pitch),sp=Math.sin(pitch);const y=Math.sin(targetPitch)*cp-Math.cos(targetPitch)*Math.cos(rel)*sp;const z=Math.sin(targetPitch)*sp+Math.cos(targetPitch)*Math.cos(rel)*cp;if(z<=0)return null;const scale=Math.tan(fov*Math.PI/360);const x=Math.sin(rel)*Math.cos(targetPitch)/z;const nx=x/(W/Math.max(1,H)*scale),ny=y/(z*scale);if(Math.abs(nx)>1.1||Math.abs(ny)>1.1)return null;return {x:(nx+1)*W/2,y:(1-ny)*H/2}}
function buildHotspots(){const root=document.getElementById('hotspots');root.replaceChildren();scenes.forEach((s,i)=>{if(i===active)return;const v=direction(scenes[active],s);const b=document.createElement('button');b.className='hotspot';b.dataset.target=i;b.setAttribute('aria-label','Go to '+s.name);const label=document.createElement('em');label.textContent=s.name;b.appendChild(label);b.addEventListener('click',()=>requestScene(i,v.yaw));root.appendChild(b)})}
function placeHotspots(){const root=document.getElementById('hotspots');root.querySelectorAll('.hotspot').forEach(b=>{const i=parseInt(b.dataset.target,10),v=direction(scenes[active],scenes[i]),pt=project(v.yaw,v.pitch);if(!pt){b.style.display='none'}else{b.style.display='grid';b.style.left=pt.x+'px';b.style.top=pt.y+'px'}})}
scenes.forEach((s,i)=>{const b=document.createElement('button');b.className='choice';b.setAttribute('aria-label',s.name);b.innerHTML='<img src="img/thumb-'+s.key+'.jpg" alt=""><span>'+s.name+'</span>';b.addEventListener('click',()=>requestScene(i));document.getElementById('choices').appendChild(b)});
canvas.addEventListener('pointerdown',e=>{if(e.target!==canvas)return;if(drag&&e.pointerType==='touch'){drag=null;pinching=true;return}try{canvas.setPointerCapture(e.pointerId)}catch(_){}drag={x:e.clientX,y:e.clientY,pointer:e.pointerId,moved:0};canvas.style.cursor='grabbing'});canvas.addEventListener('pointermove',e=>{if(!drag||pinching||e.pointerId!==drag.pointer)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;const k=fov*Math.PI/180/Math.max(1,H);drag.moved+=Math.abs(dx)+Math.abs(dy);if(drag.moved>6&&helpOpen&&Date.now()-helpAt>1500)closeHelp();yaw-=dx*k;pitch=Math.max(-89*Math.PI/180,Math.min(89*Math.PI/180,pitch+dy*k));draw()});function endDrag(){drag=null;canvas.style.cursor='grab'}canvas.addEventListener('pointerup',endDrag);canvas.addEventListener('pointercancel',endDrag);
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=clampZoom(zoom*(e.deltaY>0?1.06:1/1.06));setFov();draw()},{passive:false});let pinch=0;canvas.addEventListener('touchstart',e=>{if(e.touches.length===2){pinching=true;drag=null;pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)}},{passive:false});canvas.addEventListener('touchmove',e=>{if(e.touches.length===2){e.preventDefault();const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinch&&d){zoom=clampZoom(zoom*pinch/d);setFov();draw()}pinch=d}},{passive:false});function endPinch(e){pinch=0;if(!e.touches||e.touches.length===0)pinching=false}canvas.addEventListener('touchend',endPinch);canvas.addEventListener('touchcancel',endPinch);
addEventListener('keydown',e=>{const step=.075;if(e.key==='ArrowLeft')yaw-=step;else if(e.key==='ArrowRight')yaw+=step;else if(e.key==='ArrowUp')pitch=Math.min(89*Math.PI/180,pitch+step);else if(e.key==='ArrowDown')pitch=Math.max(-89*Math.PI/180,pitch-step);else return;draw()});document.getElementById('fullscreen').addEventListener('click',()=>{try{const d=document.documentElement,p=(d.requestFullscreen||d.webkitRequestFullscreen)?.call(d);if(p&&p.catch)p.catch(()=>{})}catch(e){}});addEventListener('resize',resize);addEventListener('orientationchange',()=>{resize();setTimeout(resize,300)});if(window.visualViewport)visualViewport.addEventListener('resize',resize);
{const d=document.documentElement;if(!d.requestFullscreen&&!d.webkitRequestFullscreen){document.getElementById('fullscreen').hidden=true;d.classList.add('nofs')}}
const help=document.getElementById('help');let helpOpen=false,helpAt=0,helpTimer;
function openHelp(){help.classList.toggle('is-touch',matchMedia('(pointer:coarse)').matches);help.classList.toggle('is-phone',Math.min(innerWidth,innerHeight)<600);help.classList.add('show');helpOpen=true;helpAt=Date.now();clearTimeout(helpTimer);helpTimer=setTimeout(closeHelp,8000)}
function closeHelp(){helpOpen=false;help.classList.remove('show');clearTimeout(helpTimer)}
document.getElementById('helpOk').addEventListener('click',closeHelp);document.getElementById('helpBtn').addEventListener('click',openHelp);addEventListener('keydown',e=>{if(e.key==='Escape'&&helpOpen)closeHelp()});window.addEventListener('tourready',()=>{if(!helpShown){helpShown=true;openHelp()}});let helpShown=false;
canvas.style.cursor='grab';resize();requestScene(1);
})();
